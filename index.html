<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastarito</title>

    <link rel="icon" href="img/user.png" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="share-trigger" onclick="toggleShareMenu(true)" title="Share Profile">
            <i class="fas fa-share-nodes"></i>
        </div>

        <header class="top">
            <div class="image">
                <img class="my_photo" src="img/my_photo.jpg?v=1" alt="Pastarito">
            </div>
            <h1>Pastarito</h1>
            <p class="bio">اختار أكلك وإحنا نوصلهولك لحد عندك...</p>
        </header>

        <div id="call-menu" class="call-menu-overlay" onclick="toggleCallMenu(false)">
            <div class="call-menu-content" onclick="event.stopPropagation()">
                <h3>اطلب الان..</h3>
                <a href="tel:+201044362491" class="num-link">
                    <i class="fas fa-sim-card"></i>  010 443 62 491
                </a>
            </div>
        </div>

        <div id="share-menu" class="call-menu-overlay" onclick="toggleShareMenu(false)">
            <div class="call-menu-content" onclick="event.stopPropagation()">
                <h3>شارك اللينك..</h3>
                
                <div id="qrcode-container">
                    <img id="qr-code" src="" alt="QR Code">
                </div>
                
                <div class="share-actions">
                    <button class="num-link" onclick="copyToClipboard()">
                        <i class="fas fa-copy"></i> <span id="copy-text">Copy Link</span>
                    </button>
                </div>
                <button class="close-btn" onclick="toggleShareMenu(false)">Close</button>
            </div>
        </div>

        <div id="payment-menu" class="call-menu-overlay" onclick="togglePaymentMenu(false)" style="display: none;">
            <div class="call-menu-content" onclick="event.stopPropagation()">
                <h3>اختار طريقة دفع: </h3>

                <a href="tel:*9*7*01044362491*#" class="num-link">
                    <i class="fas fa-mobile-alt"></i>
                    Vodafone Cash
                </a>

                <a href="https://ipn.eg/S/adham1155/instapay/3XBv1s"
                target="_blank"
                class="num-link">
                    <i class="fas fa-building-columns"></i>
                    InstaPay
                </a>

                <button class="close-btn" onclick="togglePaymentMenu(false)">Close</button>
            </div>
        </div>

        <ul class="links">
            <li>
                <a href="javascript:void(0)" onclick="toggleCallMenu(true)">
                    <i class="fas fa-phone"></i> Call Me
                </a>
            </li>
            <li>
                <a href="javascript:void(0)" onclick="togglePaymentMenu(true)">
                    <i class="fas fa-money-bill-wave"></i> Payment
                </a>
            </li>
            <li><a href="https://wa.me/201044362491" target="_blank"><i class="fab fa-whatsapp"></i> Whatsapp</a></li>
            <li><a href="https://www.facebook.com/share/18NYMBUf9W/" target="_blank"><i class="fab fa-facebook"></i> Facebook</a></li>
            <li><a href="https://www.instagram.com/pastarito_0" target="_blank"><i class="fab fa-instagram"></i> Instagram</a></li>
            <li><a href="https://www.tiktok.com/@pastarito92?_r=1&_t=ZS-99NgN9Wd9Qw" target="_blank"><i class="fab fa-tiktok"></i> TikTok</a></li>
        </ul>


        <footer class="footer">
            <p class="copyright">© 2026 Pastarito. by <a class="by" href="https://ahmd-my-portfolio.vercel.app/" target="_blank">Ahmed Reda.</a></p>
        </footer>
    </div>

    <script>
        function toggleCallMenu(open) {
            const menu = document.getElementById('call-menu');
            if(open) {
                menu.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            } else {
                menu.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        }

        function toggleShareMenu(open) {
            const menu = document.getElementById('share-menu');
            const qrImg = document.getElementById('qr-code');
            if(open) {
                const currentUrl = window.location.href;
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentUrl)}`;
                
                menu.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            } else {
                menu.style.display = 'none';
                document.body.style.overflow = 'auto';
                document.getElementById('copy-text').innerText = "Copy Link";
            }
        }

        function copyToClipboard() {
            const currentUrl = window.location.href;
            navigator.clipboard.writeText(currentUrl).then(() => {
                const copyText = document.getElementById('copy-text');
                copyText.innerText = "Copied! ✅";
                setTimeout(() => {
                    copyText.innerText = "Copy Link";
                }, 2000);
            });
        }

        function togglePaymentMenu(open) {
            const menu = document.getElementById('payment-menu');
            open ? openMenu(menu) : closeMenu(menu);
        }

        function openMenu(menu) {
            menu.style.display = 'flex'; 
        }

        function closeMenu(menu) {
            menu.style.display = 'none';
        }
    </script>
</body>
</html>
